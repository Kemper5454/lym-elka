<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Елка</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
    }

    .message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 24px;
      font-size: 20px;
    }

    model-viewer {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="message" class="message" style="display:none;">
    Пожалуйста, откройте страницу<br>
    <strong>в Safari или Chrome</strong>
  </div>

  <!-- Только для Android -->
  <model-viewer
    id="androidAR"
    src="lymtree.glb"
    exposure="1"
    shadow-intensity="1"
    environment-image="sunny_vondelpark_1k.hdr"
    shadow-softness="0.7"
    camera-controls
    auto-rotate
    autoplay
    ar
    ar-modes="scene-viewer webxr"
  ></model-viewer>

  <script>
    const isTelegram = /Telegram|TG/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    const message = document.getElementById("message");

    if (isTelegram) {
      // ❌ Telegram WebView — показываем предупреждение
      message.style.display = "flex";
    } else {
      // ✅ Нормальный браузер — запускаем AR
      window.addEventListener("load", () => {
        if (isIOS) {
          const link = document.createElement("a");
          link.href = "lymtree.usdz";
          link.rel = "ar";
          document.body.appendChild(link);
          link.click();
          link.remove();
        } 
        else if (isAndroid) {
          document.getElementById("androidAR").activateAR();
        } 
        else {
          message.innerHTML = "Откройте страницу на мобильном устройстве";
          message.style.display = "flex";
        }
      });
    }
  </script>

</body>
</html>
