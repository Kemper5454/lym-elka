<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Примерка</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #d3d3d3;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #d3d3d3;
      --poster-color: #d3d3d3;
    }

    .ar-button {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 14px 32px;
      font-size: 18px;
      font-family: inherit;
      color: black;
      background: white;
      border: none;
      border-radius: 32px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.97);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 20px;
      background: black;
    }
  </style>
</head>
<body>

  <model-viewer
    id="androidAR"
    src="lymtree.glb"
    exposure="1"
    shadow-intensity="1"
    shadow-softness="0.7"
    camera-controls
    auto-rotate
    autoplay
    ar
    ar-modes="scene-viewer webxr"
  ></model-viewer>

  <button id="arButton" class="ar-button">Открыть в AR</button>

  <div id="overlay" class="overlay" style="display:none;">
    Откройте в другом браузере
  </div>

  <script>
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    // Telegram WebView detection
    const isTelegramAndroid = isAndroid && typeof window.TelegramWebview !== 'undefined';
    const isTelegramIOS = isIOS && typeof window.TelegramWebviewProxy !== 'undefined' && typeof window.TelegramWebviewProxyProto !== 'undefined';
    const isTelegram = isTelegramAndroid || isTelegramIOS;

    const overlay = document.getElementById("overlay");
    const modelViewer = document.getElementById("androidAR");
    const arButton = document.getElementById("arButton");

    arButton.addEventListener("click", () => {
      if (isTelegram) {
        // Telegram WebView → показываем сообщение
        overlay.style.display = "flex";
      } else {
        // Обычные браузеры → AR
        if (isIOS) {
          const link = document.createElement("a");
          link.href = "lymtree.usdz";
          link.rel = "ar";
          document.body.appendChild(link);
          link.click();
          link.remove();
        } else if (isAndroid) {
          modelViewer.activateAR();
        } else {
          overlay.style.display = "flex";
          overlay.innerText = "Откройте страницу на мобильном устройстве";
        }
      }
    });

    // Тап по сообщению закрывает его и возвращает к 3D-просмотру
    overlay.addEventListener("click", () => {
      overlay.style.display = "none";
    });
  </script>

</body>
</html>
